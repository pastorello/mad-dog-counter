name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Il workflow legge il codice e basta: nessuno step scrive sul repo.
permissions:
  contents: read

env:
  # ARCHITECTURE.md -> Target: Flutter ultima stable.
  FLUTTER_CHANNEL: stable

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # L'unico punto in cui si risolvono le dipendenze. I comandi qui sotto
      # girano con --no-pub: di default `flutter analyze`, `test` e `build`
      # rifanno un `pub get` implicito ciascuno, e il log finiva per
      # risolvere tre volte le stesse dipendenze per niente.
      - name: flutter pub get
        run: flutter pub get

      # CLAUDE.md -> Convenzioni: `dart format` e `flutter analyze` puliti
      # prima di ogni commit. Qui e' la rete di sicurezza.
      - name: dart format
        run: dart format --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: flutter test
        run: flutter test --no-pub --coverage

      - name: Archivia il coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  apk:
    name: APK di debug
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Il grosso dei 5 minuti di questo job e' Gradle che riscarica e
          # ricompila da zero: la cache glielo evita.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK di debug
        run: flutter build apk --no-pub --debug

      # Comodo per sideloadare sul Galaxy Tab senza SDK Android in locale.
      - name: Archivia l'APK
        uses: actions/upload-artifact@v7
        with:
          name: mad-dog-counter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
