name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ARCHITECTURE.md -> Target: Flutter ultima stable.
  FLUTTER_CHANNEL: stable

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # CLAUDE.md -> Convenzioni: `dart format` e `flutter analyze` puliti
      # prima di ogni commit. Qui e' la rete di sicurezza.
      - name: dart format
        run: dart format --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test --coverage

      - name: Archivia il coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  apk:
    name: APK di debug
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK di debug
        run: flutter build apk --debug

      # Comodo per sideloadare sul Galaxy Tab senza SDK Android in locale.
      - name: Archivia l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mad-dog-counter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
